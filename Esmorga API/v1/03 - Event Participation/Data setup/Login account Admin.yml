info:
  name: Login account Admin
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/v1/account/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "email": "{{userAdmin}}",
          "password": "{{passwordAdmin}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const jsonData = res.getBody();

        bru.setEnvVar("adminAccessToken", jsonData.accessToken);
        bru.setEnvVar("adminRefreshToken", jsonData.refreshToken);
        bru.setEnvVar(
          "userFullName_admin",
          `${jsonData.profile.name} ${jsonData.profile.lastName}`
        );

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

