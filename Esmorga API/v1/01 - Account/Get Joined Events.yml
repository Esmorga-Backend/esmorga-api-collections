info:
  name: Get Joined Events
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/account/events"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains totalEvents", function () {
          expect(body).to.have.property("totalEvents");
          expect(body.totalEvents).to.be.a("number");
        });

        test("Response contains events array", function () {
          expect(body).to.have.property("events");
          expect(body.events).to.be.an("array");
        });

        test("Total events matches events array length", function () {
          expect(body.totalEvents).to.equal(body.events.length);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
