info:
  name: Forgot Password Update - Invalid Code
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/v1/account/password/forgot-update"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "password": "{{password}}",
          "forgotPasswordCode": "447893"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status code is 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("Response is a bad request error", function () {
          expect(body.title).to.equal("badRequestError");
        });

        test("Error is related to forgotPasswordCode", function () {
          expect(body.detail).to.equal("forgotPasswordCode");
        });

        test("Response contains invalid forgot password code error", function () {
          expect(body.errors).to.be.an("array");
          expect(body.errors).to.include("forgotPasswordCode is invalid");
        });

        test("Error type matches forgot password update endpoint", function () {
          expect(body.type).to.equal("/v1/account/password/forgot-update");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
