info:
  name: Activate Account - Invalid Verification Code
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/v1/account/activate"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "verificationCode": "257019"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const jsonData = res.getBody();

        bru.setEnvVar("accessToken", jsonData.accessToken);
        bru.setEnvVar("refreshToken", jsonData.refreshToken);
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status code is 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("Response is a bad request error", function () {
          expect(body.title).to.equal("badRequestError");
        });

        test("Error is related to verificationCode", function () {
          expect(body.detail).to.equal("verificationCode");
        });

        test("Response contains verification code invalid error", function () {
          expect(body.errors).to.be.an("array");
          expect(body.errors).to.include("verificationCode invalid");
        });

        test("Error type matches activate endpoint", function () {
          expect(body.type).to.equal("/v1/account/activate");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
