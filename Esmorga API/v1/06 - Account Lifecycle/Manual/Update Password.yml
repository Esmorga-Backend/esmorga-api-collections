info:
  name: Update Password
  type: http
  seq: 3
  tags:
    - manual

http:
  method: PUT
  url: "{{baseUrl}}/v1/account/password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
          "currentPassword": "{{password}}",
          "newPassword": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const jsonData = res.getBody();

        bru.setEnvVar("accessToken", jsonData.accessToken);
        bru.setEnvVar("refreshToken", jsonData.refreshToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
