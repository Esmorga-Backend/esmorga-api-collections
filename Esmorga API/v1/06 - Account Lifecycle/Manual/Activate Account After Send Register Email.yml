info:
  name: Activate Account After Send Register Email
  type: http
  seq: 1
  tags:
    - manual

http:
  method: PUT
  url: "{{baseUrl}}/v1/account/activate"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "verificationCode": "257019"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const jsonData = res.getBody();

        bru.setEnvVar("accessToken", jsonData.accessToken);
        bru.setEnvVar("refreshToken", jsonData.refreshToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
