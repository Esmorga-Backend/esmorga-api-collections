info:
  name: Forgot Password Update
  type: http
  seq: 2
  tags:
    - manual

http:
  method: PUT
  url: "{{baseUrl}}/v1/account/password/forgot-update"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "password": "{{password}}",
          "forgotPasswordCode": "447893"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
