info:
  name: Forgot Password Send Email
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/account/password/forgot-init"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{"email": "{{user}}"}'
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status code is 204", function () {
          expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
