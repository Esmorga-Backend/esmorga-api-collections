info:
  name: Answer Poll
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/polls/{{pollId}}/vote"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
          "selectedOptions": [
              "{{optionId1}}",
              "{{optionId3}}",
              "{{optionId4}}"
          ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains expected poll", function () {
          expect(body.pollId).to.equal(
            bru.getEnvVar("pollId")
          );
        });

        test("Poll contains required fields", function () {
          expect(body).to.have.property("pollId");
          expect(body).to.have.property("pollName");
          expect(body).to.have.property("description");
          expect(body).to.have.property("options");
          expect(body).to.have.property("voteDeadline");
          expect(body).to.have.property("isMultipleChoice");
          expect(body).to.have.property("userSelectedOptions");
        });

        test("Poll options are valid", function () {
          expect(body.options).to.be.an("array");

          body.options.forEach(option => {
            expect(option).to.have.property("optionId");
            expect(option).to.have.property("option");
            expect(option).to.have.property("voteCount");

            expect(option.voteCount).to.be.a("number");
          });
        });

        test("User selected options is an array", function () {
          expect(body.userSelectedOptions).to.be.an("array");
        });
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains expected poll", function () {
          expect(body.pollId).to.equal(bru.getEnvVar("pollId"));
        });

        test("Response contains poll options", function () {
          expect(body.options).to.be.an("array");
          expect(body.options.length).to.be.greaterThan(0);
        });

        test("Selected options are returned", function () {
          expect(body.userSelectedOptions).to.be.an("array");

          expect(body.userSelectedOptions).to.include(
            bru.getEnvVar("optionId1")
          );

          expect(body.userSelectedOptions).to.include(
            bru.getEnvVar("optionId3")
          );

          expect(body.userSelectedOptions).to.include(
            bru.getEnvVar("optionId4")
          );
        });

        test("Poll is multiple choice", function () {
          expect(body.isMultipleChoice).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
