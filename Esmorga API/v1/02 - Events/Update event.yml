info:
  name: Update event
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/v1/events"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "eventId": "{{eventId}}",
        "eventName": "Limite chars 5000",
        "eventDate": "3000-03-08T10:05:30.915Z",
        "description": "En una ciudad junto al mar, las mañanas empezaban con el sonido de las persianas al subir y el olor a café recién hecho. Las calles todavía estaban húmedas por la lluvia de la noche, y las luces de los escaparates se reflejaban en el suelo como pequeñas líneas de colores. Marta salía de casa temprano, con una mochila ligera y una libreta en la que apuntaba ideas, tareas y frases que escuchaba por casualidad. Le gustaba observar los detalles que normalmente pasaban desapercibidos: una bicicleta apoyada contra una pared azul, un perro esperando frente a una panadería, una pareja discutiendo sobre qué camino tomar o el ruido de una taza al posarse sobre una mesa de madera.Cada día seguía una ruta distinta. A veces caminaba por el paseo marítimo y otras se internaba por calles estrechas, buscando lugares nuevos aunque llevara años viviendo allí. Decía que una ciudad cambia dependiendo de la hora, del clima y de la persona que la mira. Un mismo edificio podía parecer serio bajo un cielo gris y completamente distinto cuando el sol de la tarde iluminaba sus ventanas. Esa forma de prestar atención hacía que incluso los trayectos rutinarios tuvieran algo de aventura.En su libreta no escribía grandes historias. Anotaba cosas sencillas: el nombre de una cafetería, una conversación breve, una idea para organizar mejor el trabajo, una receta que quería probar o una canción que había escuchado desde un coche parado en un semáforo. Con el tiempo, aquellas notas comenzaron a formar una especie de mapa personal. No era un mapa con calles y coordenadas, sino una colección de momentos. Cada página le recordaba dónde había estado, qué estaba pensando y qué cosas le habían llamado la atención.Una tarde decidió revisar todas las libretas que había guardado durante años. Las colocó sobre la mesa y empezó a leerlas desde la primera. Encontró planes que nunca había llevado a cabo, lugares que ya no existían y nombres de personas con las que hacía mucho tiempo que no hablaba. También encontró objetivos que en su momento parecían difíciles y que ahora formaban parte de su vida cotidiana. Aquello le hizo pensar en lo poco que se nota el cambio cuando ocurre lentamente. Día a día casi nada parece diferente, pero al mirar varios años atrás las transformaciones resultan evidentes.Desde entonces empezó a añadir una pequeña sección al final de cada semana. Escribía tres cosas que había aprendido, dos cosas que quería mejorar y una que simplemente le había hecho gracia. No pretendía convertirlo en un método perfecto ni medir cada aspecto de su vida. Solo quería conservar una referencia sencilla para recordar cómo avanzaban sus días. A veces escribía mucho y otras apenas unas líneas. Lo importante era mantener el hábito sin convertirlo en una obligación pesada.Con el paso de los meses descubrió que aquellas páginas también le ayudaban a tomar decisiones. Cuando dudaba entre varias opciones, podía revisar qué había pensado en situaciones parecidas. No siempre encontraba una respuesta, pero sí patrones. Había decisiones que se repetían, preocupaciones que con el tiempo perdían importancia y pequeños intereses que aparecían una y otra vez. Algunos de esos intereses acabaron convirtiéndose en proyectos reales simplemente porque había dejado de tratarlos como ideas pasajeras.Uno de esos proyectos fue aprender fotografía. No quería hacerlo de manera profesional; solo deseaba capturar mejor los detalles que llevaba años describiendo con palabras. Comenzó con el móvil, practicando encuadres y observando cómo cambiaba la luz durante el día. Después aprendió conceptos básicos sobre exposición, enfoque y composición. Lo que más le sorprendió fue comprobar que la fotografía no consistía únicamente en encontrar algo bonito, sino en decidir qué dejar dentro y qué dejar fuera de la imagen.Ese aprendizaje modificó también su manera de caminar por la ciudad. Empezó a fijarse en sombras, simetrías, reflejos y contrastes. Una escalera corriente podía convertirse en una imagen interesante si la luz caía de determinada manera. Una ventana abierta podía contar una historia sin mostrar a ninguna persona. Incluso los días lluviosos, que antes le parecían incómodos, ofrecían nuevas posibilidades por los reflejos sobre el asfalto y los paraguas de colores.Sin darse cuenta, Marta había construido una rutina que combinaba curiosidad, movimiento y memoria. No necesitaba viajar lejos para sentir que descubría algo nuevo. Bastaba con mirar con más atención, cambiar de camino de vez en cuando y dejar espacio para la sorpresa. Había aprendido que muchas experiencias interesantes no llegan como acontecimientos extraordinarios, sino escondidas dentro de días aparentemente normales.Al final de cada jornada seguía dejando la libreta sobre la mesa, junto a las llaves. Algunas noches escribía durante veinte minutos y otras solo una frase. Antes de apagar la luz, repasaba lo anotado y elegía algo pequeño que quería hacer al día siguiente. Y así terminó aquel día.",
        "eventType": "Party",
        "imageUrl": "image.url",
        "location": {
          "name": "A Coruña",
          "lat": 43.35525182148881,
          "long": -8.41937931298951
        },
        "tags": [
          "Dance",
          "Music"
        ],
        "joinDeadline": "3000-02-27T10:05:30.915Z",
        "maxCapacity": 50
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("description", "a".repeat(5001));
    - type: tests
      code: |-
        const body = res.getBody();
        const role = bru.getEnvVar("userRole");

        if (role === "ADMIN") {

          test("Status code is 200 for ADMIN", function () {
            expect(res.getStatus()).to.equal(200);
          });

          test("Response contains eventId", function () {
            expect(body).to.have.property("eventId");
            expect(body.eventId).to.be.a("string");
            expect(body.eventId).to.not.be.empty;
          });

          test("Event contains required fields", function () {
            expect(body).to.have.property("eventName");
            expect(body).to.have.property("eventDate");
            expect(body).to.have.property("description");
            expect(body).to.have.property("eventType");
            expect(body).to.have.property("location");
            expect(body).to.have.property("joinDeadline");
            expect(body).to.have.property("currentAttendeeCount");
          });

          test("Current attendee count is a number", function () {
            expect(body.currentAttendeeCount).to.be.a("number");
          });

          test("Location contains name", function () {
            expect(body.location).to.have.property("name");
          });

        } else if (role === "USER") {

          test("Status code is 403 for USER", function () {
            expect(res.getStatus()).to.equal(403);
          });

          test("Response indicates unauthorized request", function () {
            expect(body.title).to.equal("unauthorizedRequestError");
          });

          test("Response detail is not authorized", function () {
            expect(body.detail).to.equal("not authorized");
          });

          test("Response contains privilege error", function () {
            expect(body.errors).to.be.an("array");
            expect(body.errors).to.include("not enough privileges");
          });

        } else {

          test("Logged user role is supported", function () {
            expect(["USER", "ADMIN"]).to.include(role);
          });

        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
