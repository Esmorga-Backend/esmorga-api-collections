info:
  name: Get list events
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/events"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const jsonData = res.getBody();

        bru.setEnvVar("eventId", jsonData.events[0].eventId);
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains totalEvents", function () {
          expect(body).to.have.property("totalEvents");
          expect(body.totalEvents).to.be.a("number");
        });

        test("Response contains events array", function () {
          expect(body).to.have.property("events");
          expect(body.events).to.be.an("array");
        });

        test("Total events matches events array length", function () {
          expect(body.totalEvents).to.equal(body.events.length);
        });

        test("Each event contains required fields", function () {
          body.events.forEach(event => {
            expect(event).to.have.property("eventId");
            expect(event).to.have.property("eventName");
            expect(event).to.have.property("eventDate");
            expect(event).to.have.property("description");
            expect(event).to.have.property("eventType");
            expect(event).to.have.property("location");
            expect(event).to.have.property("joinDeadline");
            expect(event).to.have.property("currentAttendeeCount");
          });
        });

        test("Each event has a valid location", function () {
          body.events.forEach(event => {
            expect(event.location).to.be.an("object");
            expect(event.location).to.have.property("name");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
