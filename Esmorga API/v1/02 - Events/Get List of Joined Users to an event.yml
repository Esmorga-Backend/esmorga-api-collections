info:
  name: Get List of Joined Users to an event
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/events/{{eventId}}/users"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response contains totalUsers", function () {
          expect(body).to.have.property("totalUsers");
          expect(body.totalUsers).to.be.a("number");
        });

        test("Response contains users array", function () {
          expect(body).to.have.property("users");
          expect(body.users).to.be.an("array");
        });

        test("Total users matches users array length", function () {
          expect(body.totalUsers).to.equal(body.users.length);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
