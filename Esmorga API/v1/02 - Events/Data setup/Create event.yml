info:
  name: Create event
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/events"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{adminAccessToken}}
  body:
    type: json
    data: |-
      {
          "eventName": "Nuevo evento 2",
          "eventDate": "{{eventDate}}",
          "description": "Test the currentAttendeeCount",
          "eventType": "Party",
          "location": {
              "lat": 43.37041273508349,
              "long": -8.400401990375894,
              "name": "Malos Hábitos"
          },
          "joinDeadline": "{{joinDeadline}}",
          "maxCapacity":12
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
